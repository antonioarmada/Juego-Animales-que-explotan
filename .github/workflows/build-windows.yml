name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        shell: bash
        run: python -m unittest discover -s tests

      - name: Build Windows bundle
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name AnimalesExplotan \
            --icon img/icono-ventana.ico \
            --add-data "img;img" \
            --add-data "snd;snd" \
            --add-data "config.yaml;." \
            main.py

      - name: Copy external config next to exe
        shell: bash
        run: cp config.yaml dist/AnimalesExplotan/config.yaml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimalesExplotan-windows
          path: dist/AnimalesExplotan
          if-no-files-found: error
